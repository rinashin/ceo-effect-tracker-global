<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEO Effect Tracker</title>

<!-- OG / Social Preview -->
<meta property="og:title" content="CEO Effect Tracker">
<meta property="og:description" content="젠슨 황, 트럼프, 머스크, 파월… 그들의 한마디가 시장을 움직인다. 발언·방문 이벤트와 주가 변동을 한눈에.">
<meta property="og:image" content="https://ceo-effect-tracker-global.vercel.app/og-image.png">
<meta property="og:url" content="https://ceo-effect-tracker-global.vercel.app">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CEO Effect Tracker">

<!-- 트위터 카드 -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CEO Effect Tracker">
<meta name="twitter:description" content="젠슨 황, 트럼프, 머스크, 파월… 그들의 한마디가 시장을 움직인다.">
<meta name="twitter:image" content="https://ceo-effect-tracker-global.vercel.app/og-image.png">

<!-- 검색엔진 -->
<meta name="description" content="젠슨 황, 트럼프, 머스크, 파월 등 주요 인물의 발언·방문 이벤트와 주가 변동을 한눈에 확인하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg:#0a0a0a; --bg2:#111111; --bg3:#1a1a1a;
    --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.15);
    --text:#f0f0f0; --text2:#888; --text3:#555;
    --green:#00d084; --red:#ff4d4d; --accent:#c8ff00;
    --jensen:#60a5fa;   --jensen-bg:rgba(96,165,250,0.12);
    --trump:#fb923c;    --trump-bg:rgba(251,146,60,0.12);
    --masa:#a78bfa;     --masa-bg:rgba(167,139,250,0.12);
    --musk:#f472b6;     --musk-bg:rgba(244,114,182,0.12);
    --powell:#fbbf24;   --powell-bg:rgba(251,191,36,0.12);
    --altman:#34d399;   --altman-bg:rgba(52,211,153,0.12);
    --lisa:#e879f9;     --lisa-bg:rgba(232,121,249,0.12);
    --buffett:#a3e635;  --buffett-bg:rgba(163,230,53,0.12);
    --jaeyong:#ff8c69;  --jaeyong-bg:rgba(255,140,105,0.12);
    --taewon:#5eead4;   --taewon-bg:rgba(94,234,212,0.12);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }

  /* HERO */
  .hero { padding:56px 40px 36px; border-bottom:1px solid var(--border); position:relative; overflow:hidden; }
  .hero::before { content:''; position:absolute; top:-100px; left:-100px; width:400px; height:400px; background:radial-gradient(circle,rgba(200,255,0,0.04) 0%,transparent 70%); pointer-events:none; }
  .hero-tag { display:inline-flex; align-items:center; gap:6px; background:rgba(200,255,0,0.08); border:1px solid rgba(200,255,0,0.2); color:var(--accent); font-size:11px; font-weight:500; letter-spacing:0.08em; padding:4px 12px; border-radius:20px; margin-bottom:18px; }
  .hero-tag::before { content:'●'; font-size:8px; animation:blink 1.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .hero h1 { font-family:'Syne',sans-serif; font-size:40px; font-weight:700; line-height:1.1; margin-bottom:10px; background:linear-gradient(135deg,#f0f0f0 60%,#888); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .hero p { font-size:14px; color:var(--text2); max-width:520px; line-height:1.6; }

  /* MAIN */
  .main { padding:28px 40px; max-width:1100px; margin:0 auto; }

  /* STATS */
  .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px; }
  .stat-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:18px 20px; transition:border-color 0.2s; }
  .stat-card:hover { border-color:var(--border2); }
  .stat-label { font-size:11px; color:var(--text3); letter-spacing:0.06em; margin-bottom:6px; }
  .stat-value { font-family:'Syne',sans-serif; font-size:26px; font-weight:600; color:var(--accent); }
  .stat-sub { font-size:11px; color:var(--text3); margin-top:4px; }

  /* PERSON FILTER SECTION */
  .person-section { margin-bottom:24px; }
  .region-label { font-size:11px; font-weight:600; color:var(--text3); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:10px; }
  .person-chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .person-chip { display:flex; align-items:center; gap:7px; padding:7px 14px; border-radius:24px; border:1px solid var(--border); background:transparent; font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; color:var(--text2); transition:all 0.15s; }
  .person-chip:hover { border-color:var(--border2); color:var(--text); }
  .person-chip.active { font-weight:500; }
  .chip-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .chip-all { color:var(--text2); }
  .chip-all.active { background:var(--bg3); border-color:var(--border2); color:var(--text); }

  .chip-jensen.active  { background:var(--jensen-bg);  border-color:var(--jensen);  color:var(--jensen);  }
  .chip-trump.active   { background:var(--trump-bg);   border-color:var(--trump);   color:var(--trump);   }
  .chip-masa.active    { background:var(--masa-bg);    border-color:var(--masa);    color:var(--masa);    }
  .chip-musk.active    { background:var(--musk-bg);    border-color:var(--musk);    color:var(--musk);    }
  .chip-powell.active  { background:var(--powell-bg);  border-color:var(--powell);  color:var(--powell);  }
  .chip-altman.active  { background:var(--altman-bg);  border-color:var(--altman);  color:var(--altman);  }
  .chip-lisa.active    { background:var(--lisa-bg);    border-color:var(--lisa);    color:var(--lisa);    }
  .chip-buffett.active { background:var(--buffett-bg); border-color:var(--buffett); color:var(--buffett); }
  .chip-jaeyong.active { background:var(--jaeyong-bg); border-color:var(--jaeyong); color:var(--jaeyong); }
  .chip-taewon.active  { background:var(--taewon-bg);  border-color:var(--taewon);  color:var(--taewon);  }

  .divider-line { border:none; border-top:1px solid var(--border); margin:12px 0; }

  /* CONTENT TABS */
  .tab-bar { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; }
  .tab-btn { padding:8px 18px; background:transparent; border:none; border-bottom:2px solid transparent; font-family:'DM Sans',sans-serif; font-size:13px; color:var(--text2); cursor:pointer; transition:all 0.15s; margin-bottom:-1px; }
  .tab-btn:hover { color:var(--text); }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* TIMELINE */
  .timeline { display:flex; flex-direction:column; gap:8px; }
  .event-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:15px 17px; display:grid; grid-template-columns:85px 1fr auto; gap:14px; align-items:start; transition:all 0.18s; }
  .event-card:hover { border-color:var(--border2); background:var(--bg3); transform:translateX(2px); }
  .new-badge { display:inline-block; font-size:10px; font-weight:600; background:var(--accent); color:#000; padding:1px 6px; border-radius:4px; margin-left:6px; vertical-align:middle; }
  .event-date { font-size:11px; color:var(--text3); padding-top:3px; line-height:1.5; }
  .person-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500; padding:3px 9px; border-radius:10px; margin-bottom:7px; }
  .badge-jensen  { background:var(--jensen-bg);  color:var(--jensen);  }
  .badge-trump   { background:var(--trump-bg);   color:var(--trump);   }
  .badge-masa    { background:var(--masa-bg);    color:var(--masa);    }
  .badge-musk    { background:var(--musk-bg);    color:var(--musk);    }
  .badge-powell  { background:var(--powell-bg);  color:var(--powell);  }
  .badge-altman  { background:var(--altman-bg);  color:var(--altman);  }
  .badge-lisa    { background:var(--lisa-bg);    color:var(--lisa);    }
  .badge-buffett { background:var(--buffett-bg); color:var(--buffett); }
  .badge-jaeyong { background:var(--jaeyong-bg); color:var(--jaeyong); }
  .badge-taewon  { background:var(--taewon-bg);  color:var(--taewon);  }
  .event-title { font-size:14px; font-weight:500; color:var(--text); margin-bottom:4px; line-height:1.4; }
  .event-desc { font-size:12px; color:var(--text2); line-height:1.6; }
  .event-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
  .etag { font-size:10px; padding:2px 7px; border-radius:4px; border:1px solid var(--border); color:var(--text3); font-family:monospace; }
  .change-box { text-align:right; padding-top:2px; }
  .change-val { font-family:'Syne',sans-serif; font-size:18px; font-weight:600; }
  .up { color:var(--green); } .down { color:var(--red); }
  .change-period { font-size:10px; color:var(--text3); margin-top:3px; }
  .year-divider { font-size:11px; font-weight:600; color:var(--text3); letter-spacing:0.1em; padding:8px 0 4px; border-top:1px solid var(--border); margin-top:4px; }
  .empty-state { text-align:center; padding:40px 0; color:var(--text3); font-size:13px; }

  /* STOCK TABLE */
  .chart-box { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
  .stock-table { width:100%; border-collapse:collapse; }
  .stock-table thead tr { border-bottom:1px solid var(--border2); }
  .stock-table th { font-size:11px; color:var(--text3); font-weight:500; letter-spacing:0.06em; text-align:left; padding:0 12px 10px; }
  .stock-table th:nth-child(3), .stock-table td:nth-child(3),
  .stock-table th:nth-child(4), .stock-table td:nth-child(4) { text-align:right; }
  .stock-table tbody tr { border-bottom:1px solid var(--border); transition:background 0.12s; }
  .stock-table tbody tr:hover { background:var(--bg3); }
  .stock-table tbody tr:last-child { border-bottom:none; }
  .stock-table td { padding:12px; font-size:13px; color:var(--text); vertical-align:middle; }
  .stock-name { font-weight:500; }
  .stock-ticker { font-family:monospace; font-size:11px; color:var(--text3); margin-top:2px; }
  .ptag { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 8px; border-radius:8px; }
  .ptag-jensen  { background:var(--jensen-bg);  color:var(--jensen);  }
  .ptag-trump   { background:var(--trump-bg);   color:var(--trump);   }
  .ptag-masa    { background:var(--masa-bg);    color:var(--masa);    }
  .ptag-musk    { background:var(--musk-bg);    color:var(--musk);    }
  .ptag-powell  { background:var(--powell-bg);  color:var(--powell);  }
  .ptag-altman  { background:var(--altman-bg);  color:var(--altman);  }
  .ptag-lisa    { background:var(--lisa-bg);    color:var(--lisa);    }
  .ptag-buffett { background:var(--buffett-bg); color:var(--buffett); }
  .ptag-jaeyong { background:var(--jaeyong-bg); color:var(--jaeyong); }
  .ptag-taewon  { background:var(--taewon-bg);  color:var(--taewon);  }
  .chg-up { color:var(--green); font-family:'Syne',sans-serif; font-weight:600; }
  .chg-down { color:var(--red); font-family:'Syne',sans-serif; font-weight:600; }
  .ctx { font-size:12px; color:var(--text2); line-height:1.5; }

  /* CHART */
  .legend { display:flex; gap:14px; font-size:11px; color:var(--text2); margin-bottom:10px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .ldot { width:10px; height:10px; border-radius:2px; }
  .chart-wrapper { position:relative; width:100%; height:230px; }

  .footer { padding:22px 40px; border-top:1px solid var(--border); text-align:center; font-size:11px; color:var(--text3); }

  /* ── MOBILE (≤480px) ── */
  @media (max-width: 480px) {
    .hero { padding:36px 20px 28px; }
    .hero h1 { font-size:28px; }
    .hero p { font-size:13px; }
    .main { padding:20px 16px; }

    /* stats: 1열 */
    .stats-grid { grid-template-columns:1fr; gap:8px; margin-bottom:20px; }
    .stat-card { padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
    .stat-label { margin-bottom:0; font-size:12px; }
    .stat-value { font-size:22px; }
    .stat-sub { display:none; }

    /* person chips: 가로 스크롤 */
    .person-chips { flex-wrap:nowrap; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .person-chips::-webkit-scrollbar { display:none; }
    .person-chip { white-space:nowrap; flex-shrink:0; padding:6px 12px; font-size:12px; }

    /* tabs: 균등 분할 */
    .tab-bar { gap:0; }
    .tab-btn { flex:1; padding:10px 4px; font-size:12px; text-align:center; }

    /* event card: 2열 → 세로 스택 */
    .event-card { grid-template-columns:1fr auto; grid-template-rows:auto auto; gap:8px; padding:14px; }
    .event-date { grid-column:1; grid-row:1; font-size:11px; padding-top:0; }
    .change-box { grid-column:2; grid-row:1; }
    .event-card > div:nth-child(2) { grid-column:1/3; grid-row:2; }
    .event-card:hover { transform:none; }
    .change-val { font-size:16px; }

    /* stock table: 맥락 컬럼 숨김, 패딩 줄임 */
    .stock-table th:nth-child(5),
    .stock-table td:nth-child(5) { display:none; }
    .stock-table th:nth-child(4),
    .stock-table td:nth-child(4) { display:none; }
    .stock-table td { padding:10px 8px; font-size:12px; }
    .stock-table th { padding:0 8px 10px; font-size:10px; }
    .chart-box { padding:14px; }

    /* chart */
    .chart-wrapper { height:200px; }

    .footer { padding:18px 16px; }
  }

  /* ── TABLET (481~768px) ── */
  @media (min-width:481px) and (max-width:768px) {
    .hero { padding:44px 24px 32px; }
    .hero h1 { font-size:34px; }
    .main { padding:24px 24px; }
    .stats-grid { grid-template-columns:repeat(3,1fr); gap:10px; }
    .stat-value { font-size:22px; }
    .person-chips { flex-wrap:nowrap; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .person-chips::-webkit-scrollbar { display:none; }
    .person-chip { white-space:nowrap; flex-shrink:0; }
    .event-card { grid-template-columns:70px 1fr auto; gap:10px; }
    .stock-table th:nth-child(5),
    .stock-table td:nth-child(5) { display:none; }
    .stock-table td { padding:10px; font-size:12px; }
    .footer { padding:18px 24px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-tag">LIVE TRACKER</div>
  <h1>CEO Effect<br>Tracker</h1>
  <p>젠슨 황, 트럼프, 머스크, 파월… 그들의 한마디가 시장을 움직인다.<br>발언·방문 이벤트와 주가 변동을 한눈에.</p>
</div>

<div class="main">
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">평균 주가 변동</div>
      <div class="stat-value" id="stat-avg">—</div>
      <div class="stat-sub">이벤트 후 평균</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">최대 단일 이벤트</div>
      <div class="stat-value" id="stat-max">—</div>
      <div class="stat-sub" id="stat-max-sub">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">추적 이벤트</div>
      <div class="stat-value" id="stat-count">—</div>
      <div class="stat-sub">2025~2026년</div>
    </div>
  </div>

  <!-- PERSON FILTER -->
  <div class="person-section">
    <div class="region-label">🌏 해외 인물</div>
    <div class="person-chips" id="chips-global">
      <button class="person-chip chip-all active" data-person="all" onclick="filterPerson('all',this)">
        <span class="chip-dot" style="background:var(--text3)"></span>전체
      </button>
      <button class="person-chip chip-jensen" data-person="jensen" onclick="filterPerson('jensen',this)">
        <span class="chip-dot" style="background:var(--jensen)"></span>젠슨 황
      </button>
      <button class="person-chip chip-trump" data-person="trump" onclick="filterPerson('trump',this)">
        <span class="chip-dot" style="background:var(--trump)"></span>트럼프
      </button>
      <button class="person-chip chip-masa" data-person="masa" onclick="filterPerson('masa',this)">
        <span class="chip-dot" style="background:var(--masa)"></span>손정의
      </button>
      <button class="person-chip chip-musk" data-person="musk" onclick="filterPerson('musk',this)">
        <span class="chip-dot" style="background:var(--musk)"></span>일론 머스크
      </button>
      <button class="person-chip chip-powell" data-person="powell" onclick="filterPerson('powell',this)">
        <span class="chip-dot" style="background:var(--powell)"></span>제롬 파월
      </button>
      <button class="person-chip chip-altman" data-person="altman" onclick="filterPerson('altman',this)">
        <span class="chip-dot" style="background:var(--altman)"></span>샘 알트만
      </button>
      <button class="person-chip chip-lisa" data-person="lisa" onclick="filterPerson('lisa',this)">
        <span class="chip-dot" style="background:var(--lisa)"></span>리사 수
      </button>
      <button class="person-chip chip-buffett" data-person="buffett" onclick="filterPerson('buffett',this)">
        <span class="chip-dot" style="background:var(--buffett)"></span>워런 버핏
      </button>
    </div>
    <hr class="divider-line">
    <div class="region-label">🇰🇷 국내 인물</div>
    <div class="person-chips" id="chips-kr">
      <button class="person-chip chip-jaeyong" data-person="jaeyong" onclick="filterPerson('jaeyong',this)">
        <span class="chip-dot" style="background:var(--jaeyong)"></span>이재용
      </button>
      <button class="person-chip chip-taewon" data-person="taewon" onclick="filterPerson('taewon',this)">
        <span class="chip-dot" style="background:var(--taewon)"></span>최태원
      </button>
    </div>
  </div>

  <!-- CONTENT TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('timeline',this)">이벤트 타임라인</button>
    <button class="tab-btn" onclick="switchTab('stocks',this)">종목별 영향</button>
    <button class="tab-btn" onclick="switchTab('chart',this)">변동률 차트</button>
  </div>

  <!-- TAB: TIMELINE -->
  <div class="tab-panel active" id="tab-timeline">
    <div class="timeline" id="timeline"></div>
  </div>

  <!-- TAB: STOCKS -->
  <div class="tab-panel" id="tab-stocks">
    <div class="chart-box">
      <table class="stock-table" id="stock-table">
        <thead>
          <tr>
            <th>종목</th>
            <th>언급 인물</th>
            <th>변동률</th>
            <th>기간</th>
            <th>맥락</th>
          </tr>
        </thead>
        <tbody id="stock-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- TAB: CHART -->
  <div class="tab-panel" id="tab-chart">
    <div class="legend">
      <span><span class="ldot" style="background:#00d084"></span>상승</span>
      <span><span class="ldot" style="background:#ff4d4d"></span>하락</span>
      <span style="color:var(--text3);font-size:11px;">* 광전자 +447%는 스케일상 별도 표기</span>
    </div>
    <div class="chart-box">
      <div class="chart-wrapper">
        <canvas id="barChart" role="img" aria-label="종목별 주가 변동률 막대 차트">종목별 이벤트 후 주가 변동률</canvas>
      </div>
    </div>
  </div>
</div>

let currentFilter = 'all';
let chartInstance = null;

function filterPerson(person, btn) {
  currentFilter = person;
  document.querySelectorAll('.person-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
  if (id === 'chart') renderChart();
}

function getFiltered(list) {
  if (currentFilter === 'all') return list;
  return list.filter(e => e.person === currentFilter);
}

function renderAll() {
  renderTimeline();
  renderStocks();
  updateStats();
  if (document.getElementById('tab-chart').classList.contains('active')) renderChart();
}

function renderTimeline() {
  const filtered = getFiltered(events);
  let html = ''; let lastYear = '';
  filtered.forEach(e => {
    const year = e.date.slice(0,4);
    if (year !== lastYear) { html += `<div class="year-divider">${year}</div>`; lastYear = year; }
    const nb = e.isNew ? '<span class="new-badge">NEW</span>' : '';
    html += `<div class="event-card">
      <div class="event-date">${e.date}</div>
      <div>
        <span class="person-badge badge-${e.person}">${personMeta[e.person].label}</span>${nb}
        <div class="event-title">${e.title}</div>
        <div class="event-desc">${e.desc}</div>
        <div class="event-tags">${e.tags.map(t=>`<span class="etag">${t}</span>`).join('')}</div>
      </div>
      <div class="change-box">
        <div class="change-val ${e.change>=0?'up':'down'}">${e.change>=0?'+':''}${e.change}%</div>
        <div class="change-period">${e.period}</div>
      </div>
    </div>`;
  });
  document.getElementById('timeline').innerHTML = html || '<div class="empty-state">해당 인물의 이벤트가 없습니다.</div>';
}

function renderStocks() {
  const filtered = getFiltered(stockRows);
  const sorted = [...filtered].sort((a,b) => b.change - a.change);
  document.getElementById('stock-tbody').innerHTML = sorted.map(r => `
    <tr>
      <td><div class="stock-name">${r.name}</div><div class="stock-ticker">${r.ticker}</div></td>
      <td><span class="ptag ptag-${r.person}">${personMeta[r.person].label}</span></td>
      <td class="${r.change>=0?'chg-up':'chg-down'}">${r.change>=0?'+':''}${r.change}%</td>
      <td style="font-size:12px;color:var(--text2);text-align:right">${r.period}</td>
      <td class="ctx">${r.ctx}</td>
    </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text3)">해당 인물의 종목 데이터가 없습니다.</td></tr>`;
}

function updateStats() {
  const filtered = getFiltered(events);
  if (!filtered.length) {
    document.getElementById('stat-avg').textContent = '—';
    document.getElementById('stat-max').textContent = '—';
    document.getElementById('stat-max-sub').textContent = '—';
    document.getElementById('stat-count').textContent = '0';
    return;
  }
  const normal = filtered.filter(e => Math.abs(e.change) < 100);
  const avg = normal.length ? normal.reduce((s,e)=>s+e.change,0)/normal.length : 0;
  const maxEv = filtered.reduce((m,e) => e.change > m.change ? e : m, filtered[0]);
  document.getElementById('stat-avg').textContent = (avg>=0?'+':'')+avg.toFixed(1)+'%';
  document.getElementById('stat-max').textContent = (maxEv.change>=0?'+':'')+maxEv.change+'%';
  document.getElementById('stat-max-sub').textContent = maxEv.tags[0]+' · '+personMeta[maxEv.person].label;
  document.getElementById('stat-count').textContent = filtered.length;
}

function renderChart() {
  const filtered = getFiltered(stockRows).filter(r => Math.abs(r.change) < 100);
  // dedupe by name+person, keep max change
  const deduped = Object.values(
    filtered.reduce((acc, r) => {
      const key = r.name + '_' + r.person;
      if (!acc[key] || Math.abs(r.change) > Math.abs(acc[key].change)) acc[key] = r;
      return acc;
    }, {})
  ).sort((a,b) => b.change - a.change);

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  if (!deduped.length) return;

  chartInstance = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: deduped.map(r => r.name),
      datasets: [{
        data: deduped.map(r => r.change),
        backgroundColor: deduped.map(r => r.change >= 0 ? '#00d084' : '#ff4d4d'),
        borderRadius: 6, borderSkipped: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks:{ font:{size:11,family:'monospace'}, color:'#555', autoSkip:false, maxRotation:30 }, grid:{display:false}, border:{color:'rgba(255,255,255,0.05)'} },
        y: { ticks:{ callback:v=>v+'%', font:{size:11}, color:'#555' }, grid:{color:'rgba(255,255,255,0.04)'}, border:{color:'rgba(255,255,255,0.05)'} }
      }
    }
  });
}

renderAll();
</script>
